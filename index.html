<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StorySum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--brand:#6366f1;--brand2:#8b5cf6;--brand-soft:#eef2ff;--err:#e11d48;--shadow:0 10px 30px -12px rgba(30,41,99,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Arabic","Noto Sans SC",system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.6}
html[lang=ar] *{letter-spacing:0!important}
.hero{background:linear-gradient(135deg,#4338ca 0%,#6366f1 45%,#8b5cf6 100%);padding-bottom:110px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:380px;height:380px;inset-inline-end:-120px;top:-140px}
.hero::after{width:240px;height:240px;inset-inline-start:-80px;bottom:-110px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto;padding:18px 20px;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#fff}
.logo span{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px}
.right{display:flex;align-items:center;gap:10px}
.badge{font-size:12px;font-weight:600;color:#e0e7ff;border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:999px}
#lang{font:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;cursor:pointer}
#lang option{color:#0f172a}
.hero-text{max-width:960px;margin:0 auto;padding:30px 20px 0;color:#fff;position:relative;z-index:1}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.2}
.hero p{margin:0;max-width:540px;color:#e0e7ff;font-size:17px}
main{max-width:960px;margin:-80px auto 50px;padding:0 20px;position:relative;z-index:2}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:24px;margin-bottom:22px;border:1px solid rgba(226,232,240,.7)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head h2{margin:0;font-size:16px;font-weight:700}
.chip{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 10px;border-radius:999px}
textarea{width:100%;min-height:230px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:16px;font:inherit;font-size:15px;color:var(--ink);background:#f8fafc;transition:.2s}
textarea:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,102,241,.15);background:#fff}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:20px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(15,23,42,.1)}
#aibox{display:none;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
#aibox input,#aibox select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#f8fafc}
#aibox small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;font:inherit;font-weight:700;border-radius:12px;padding:13px 26px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px -6px rgba(99,102,241,.6)}
.primary:hover{transform:translateY(-2px)}
.primary:disabled{opacity:.7;transform:none;cursor:wait}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.ghost:hover{border-color:var(--brand);color:var(--brand)}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;display:none}
.loading .spin{display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
#res{display:none;animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#out{font-size:17px;line-height:1.8;border-inline-start:4px solid var(--brand);padding:4px 0;padding-inline-start:18px;margin:4px 0 18px;white-space:pre-wrap}
#out.err{color:var(--err);border-color:var(--err)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--brand-soft);border-radius:12px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.upload .btn{padding:9px 16px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
textarea.drag{border-color:var(--brand);background:var(--brand-soft)}
footer{text-align:center;color:var(--muted);font-size:13px;padding-bottom:30px}
</style>
</head>
<body>

<header class="hero">
  <div class="nav">
    <div class="logo"><span>📖</span>StorySum</div>
    <div class="right">
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
      </select>
      <div class="badge" data-i18n="tag"></div>
    </div>
  </div>
  <div class="hero-text">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="sub"></p>
  </div>
</header>

<main>
  <section class="card">
    <div class="head"><h2 data-i18n="yourStory"></h2><span class="chip" id="count"></span></div>
    <div class="upload">
      <button class="btn ghost" id="pick" data-i18n="upload"></button>
      <input type="file" id="file" accept=".pdf,.txt,application/pdf,text/plain" hidden>
      <span class="chip" id="fname" style="display:none"></span>
      <span class="hint" data-i18n="drop"></span>
    </div>
    <textarea id="story" dir="auto" data-ph="ph"></textarea>

    <div class="controls">
      <div><label data-i18n="method"></label>
        <div class="seg" id="modeSeg">
          <button data-v="local" class="on" data-i18n="smart"></button>
          <button data-v="ai" data-i18n="ai"></button>
        </div>
      </div>
      <div><label data-i18n="length"></label>
        <div class="seg" id="sizeSeg">
          <button data-v="2" data-i18n="vshort"></button>
          <button data-v="4" class="on" data-i18n="short"></button>
          <button data-v="7" data-i18n="detailed"></button>
        </div>
      </div>
    </div>

    <div id="aibox">
      <div><label for="key" data-i18n="keyLbl"></label>
        <input type="password" id="key" dir="ltr" placeholder="sk-ant-...">
        <small data-i18n="keyNote"></small></div>
      <div><label for="slang" data-i18n="sumLang"></label>
        <select id="slang">
          <option value="same" data-i18n="same"></option>
          <option value="English">English</option>
          <option value="Arabic">العربية</option>
          <option value="French">Français</option>
          <option value="Chinese">中文</option>
        </select></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="go"><span class="spin"></span><span id="goTxt" data-i18n="summarise"></span></button>
      <button class="btn ghost" id="clr" data-i18n="clear"></button>
    </div>
  </section>

  <section class="card" id="res">
    <div class="head"><h2 data-i18n="summary"></h2><button class="btn ghost" id="copy" style="padding:8px 16px;font-size:14px" data-i18n="copy"></button></div>
    <div id="out" dir="auto"></div>
    <div class="stats" id="stats"></div>
  </section>
</main>
<footer data-i18n="footer"></footer>

<script>
var T={
en:{tag:'ICT Project',h1:'Turn any long story into a short summary.',sub:'Paste a story, choose how short you want it, and get the key points in seconds.',yourStory:'Your story',ph:'Paste or type your story here…',words:'words',method:'Method',smart:'Smart (offline)',ai:'AI (API key)',length:'Summary length',vshort:'Very short',short:'Short',detailed:'Detailed',keyLbl:'Anthropic API key',keyNote:'Used only on this page and never saved.',sumLang:'Summary language (AI)',same:'Same as the story',summarise:'✨ Summarise',working:'Summarising…',clear:'Clear',summary:'Summary',copy:'Copy',copied:'Copied ✓',origW:'Original',sumW:'Summary',shorter:'Shorter',tooShort:'Please paste a longer story (at least 30 words).',needKey:'Please enter your Anthropic API key.',fail:'Something went wrong.',footer:'StorySum · ICT Project',upload:'📄 Upload PDF',drop:'or drag a PDF / TXT file here',reading:'Reading file…',pdfEmpty:'No text found. This PDF may be scanned (images only).',pdfFail:'Could not read this file.',pdfLib:'The PDF reader could not load. Check your internet connection.'},
ar:{tag:'مشروع تكنولوجيا المعلومات',h1:'حوّل أي قصة طويلة إلى ملخص قصير.',sub:'الصق القصة، واختر طول الملخص الذي تريده، واحصل على النقاط الرئيسية في ثوانٍ.',yourStory:'قصتك',ph:'الصق قصتك أو اكتبها هنا…',words:'كلمة',method:'الطريقة',smart:'ذكية (دون إنترنت)',ai:'ذكاء اصطناعي (مفتاح API)',length:'طول الملخص',vshort:'قصير جدًا',short:'قصير',detailed:'مفصّل',keyLbl:'مفتاح Anthropic API',keyNote:'يُستخدم في هذه الصفحة فقط ولا يتم حفظه.',sumLang:'لغة الملخص (ذكاء اصطناعي)',same:'نفس لغة القصة',summarise:'✨ لخّص',working:'جارٍ التلخيص…',clear:'مسح',summary:'الملخص',copy:'نسخ',copied:'تم النسخ ✓',origW:'الأصلي',sumW:'الملخص',shorter:'أقصر بنسبة',tooShort:'من فضلك الصق قصة أطول (30 كلمة على الأقل).',needKey:'من فضلك أدخل مفتاح Anthropic API.',fail:'حدث خطأ ما.',footer:'StorySum · مشروع تكنولوجيا المعلومات',upload:'📄 رفع ملف PDF',drop:'أو اسحب ملف PDF / TXT هنا',reading:'جارٍ قراءة الملف…',pdfEmpty:'لم يتم العثور على نص. قد يكون ملف PDF ممسوحًا ضوئيًا (صور فقط).',pdfFail:'تعذّرت قراءة هذا الملف.',pdfLib:'تعذّر تحميل قارئ PDF. تحقق من اتصالك بالإنترنت.'},
fr:{tag:'Projet TIC',h1:'Transformez n’importe quelle longue histoire en un court résumé.',sub:'Collez une histoire, choisissez la longueur voulue et obtenez l’essentiel en quelques secondes.',yourStory:'Votre histoire',ph:'Collez ou saisissez votre histoire ici…',words:'mots',method:'Méthode',smart:'Intelligente (hors ligne)',ai:'IA (clé API)',length:'Longueur du résumé',vshort:'Très court',short:'Court',detailed:'Détaillé',keyLbl:'Clé API Anthropic',keyNote:'Utilisée uniquement sur cette page, jamais enregistrée.',sumLang:'Langue du résumé (IA)',same:'Même langue que l’histoire',summarise:'✨ Résumer',working:'Résumé en cours…',clear:'Effacer',summary:'Résumé',copy:'Copier',copied:'Copié ✓',origW:'Original',sumW:'Résumé',shorter:'Plus court',tooShort:'Veuillez coller une histoire plus longue (au moins 30 mots).',needKey:'Veuillez saisir votre clé API Anthropic.',fail:'Une erreur s’est produite.',footer:'StorySum · Projet TIC',upload:'📄 Importer un PDF',drop:'ou glissez un fichier PDF / TXT ici',reading:'Lecture du fichier…',pdfEmpty:'Aucun texte trouvé. Ce PDF est peut-être scanné (images uniquement).',pdfFail:'Impossible de lire ce fichier.',pdfLib:'Le lecteur PDF n’a pas pu se charger. Vérifiez votre connexion Internet.'},
zh:{tag:'信息技术项目',h1:'把任何长故事变成简短摘要。',sub:'粘贴故事，选择摘要长度，几秒钟内即可获得要点。',yourStory:'你的故事',ph:'在此粘贴或输入你的故事…',words:'字',method:'方式',smart:'智能（离线）',ai:'AI（API 密钥）',length:'摘要长度',vshort:'极短',short:'简短',detailed:'详细',keyLbl:'Anthropic API 密钥',keyNote:'仅在本页面使用，不会被保存。',sumLang:'摘要语言（AI）',same:'与故事相同',summarise:'✨ 生成摘要',working:'正在生成…',clear:'清除',summary:'摘要',copy:'复制',copied:'已复制 ✓',origW:'原文',sumW:'摘要',shorter:'缩短',tooShort:'请粘贴更长的故事（至少 30 字）。',needKey:'请输入 Anthropic API 密钥。',fail:'出错了。',footer:'StorySum · 信息技术项目',upload:'📄 上传 PDF',drop:'或将 PDF / TXT 文件拖到此处',reading:'正在读取文件…',pdfEmpty:'未找到文字。此 PDF 可能是扫描件（仅图片）。',pdfFail:'无法读取此文件。',pdfLib:'PDF 阅读器加载失败，请检查网络连接。'}
};
var $=function(i){return document.getElementById(i)};
var story=$('story'),out=$('out'),res=$('res'),go=$('go'),mode='local',size=4,L='en',last=null;
function t(k){return T[L][k]}
var CJK=/[\u3400-\u9fff]/g;

/* word count: Latin/Arabic words + each Chinese character */
function words(s){
  var c=(s.match(CJK)||[]).length;
  var w=(s.replace(CJK,' ').match(/[\p{L}\p{N}]+/gu)||[]).length;
  return c+w;
}
function updateCount(){$('count').textContent=words(story.value).toLocaleString('en')+' '+t('words')}

function renderStats(){
  if(!last){$('stats').innerHTML='';return}
  var u=' '+t('words');
  $('stats').innerHTML=
   '<div class="stat"><b>'+last.a.toLocaleString('en')+'</b><span>'+t('origW')+u+'</span></div>'+
   '<div class="stat"><b>'+last.b.toLocaleString('en')+'</b><span>'+t('sumW')+u+'</span></div>'+
   '<div class="stat"><b>'+last.cut+'%</b><span>'+t('shorter')+'</span></div>';
}

function applyLang(code){
  L=code;
  document.documentElement.lang=code;
  document.documentElement.dir=code==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=t(e.dataset.ph)});
  document.title='StorySum – '+t('tag');
  if(out.dataset.key)out.textContent=t(out.dataset.key);
  updateCount();renderStats();
  try{localStorage.setItem('storysum-lang',code)}catch(e){}
}
$('lang').onchange=function(){applyLang(this.value)};
story.oninput=updateCount;

function seg(id,cb){
  var box=$(id);
  box.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    box.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');cb(b.dataset.v);
  };
}
seg('modeSeg',function(v){mode=v;$('aibox').style.display=v==='ai'?'grid':'none'});
seg('sizeSeg',function(v){size=parseInt(v,10)});

$('clr').onclick=function(){story.value='';updateCount();res.style.display='none';last=null};
$('copy').onclick=function(){
  navigator.clipboard.writeText(out.textContent);
  var b=this;b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1500);
};

/* Break text into tokens: Latin/Arabic words + Chinese character pairs */
var STOP=new Set(('the a an and or but of to in on at for with as by is was were be been it its he she they them his her their i you we that this these those from had has have not so if then than very said '+
 'le la les un une des du de et ou mais en dans sur au aux pour avec par est était sont il elle ils elles son sa ses leur que qui ce cette ces ne pas se plus très '+
 'في من على إلى عن مع أن إن هذا هذه ذلك التي الذي كان كانت هو هي هم ما لا قد كل ثم أو و').split(' '));
function tokens(s){
  var out=[];
  s=s.toLowerCase().replace(/[\u3400-\u9fff]+/g,function(run){
    if(run.length===1)out.push(run);
    for(var i=0;i<run.length-1;i++)out.push(run.substr(i,2));
    return ' ';
  });
  (s.match(/[\p{L}']+/gu)||[]).forEach(function(w){if(w.length>2&&!STOP.has(w))out.push(w)});
  return out;
}

/* Offline summariser: scores each sentence by how common its words are */
function localSummary(text,n){
  var re=/[^.!?。！？؟\n]+[.!?。！？؟]+["'”’)\]»」]*|[^.!?。！？؟\n]+$/g;
  var sents=(text.replace(/[ \t]+/g,' ').match(re)||[text]).map(function(s){return s.trim()}).filter(Boolean);
  if(sents.length<=n)return sents.join(' ');
  var freq={};
  tokens(text).forEach(function(w){freq[w]=(freq[w]||0)+1});
  var scored=sents.map(function(s,i){
    var ws=tokens(s);
    var sc=ws.reduce(function(a,w){return a+freq[w]},0)/Math.sqrt(ws.length||1);
    if(i===0)sc*=1.3;
    return{i:i,s:s,sc:sc};
  });
  var sep=CJK.test(text.slice(0,200))?'':' ';CJK.lastIndex=0;
  return scored.sort(function(a,b){return b.sc-a.sc}).slice(0,n).sort(function(a,b){return a.i-b.i}).map(function(x){return x.s}).join(sep);
}

async function aiSummary(text,n){
  var key=$('key').value.trim();
  if(!key)throw {key:'needKey'};
  var sl=$('slang').value;
  var langRule=sl==='same'?'Write the summary in the same language as the story.':'Write the summary in '+sl+'.';
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:900,messages:[{role:'user',content:'Summarise this story in about '+n+' sentences. '+langRule+' Do not add facts that are not in the story. Reply with the summary only.\n\n'+text}]})
  });
  var d=await r.json();
  if(!r.ok)throw new Error((d.error&&d.error.message)||'');
  return d.content.map(function(c){return c.text||''}).join('');
}

function showErr(k,msg){out.className='err';out.dataset.key=k||'';out.textContent=k?t(k):msg}

go.onclick=async function(){
  var text=story.value.trim();
  res.style.display='block';out.className='';out.dataset.key='';last=null;renderStats();
  if(words(text)<30){showErr('tooShort');return}
  go.disabled=true;go.classList.add('loading');$('goTxt').textContent=t('working');out.textContent='';
  try{
    var s=mode==='ai'?await aiSummary(text,size):localSummary(text,size);
    out.textContent=s;
    var a=words(text),b=words(s);
    last={a:a,b:b,cut:Math.max(0,Math.round(100-b/a*100))};
    renderStats();
  }catch(e){
    if(e&&e.key)showErr(e.key);else showErr('',e&&e.message?e.message:t('fail'));
  }
  go.disabled=false;go.classList.remove('loading');$('goTxt').textContent=t('summarise');
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
};

/* PDF / TXT upload */
var workerReady=false;
async function readPDF(file){
  if(!window.pdfjsLib)throw {key:'pdfLib'};
  if(!workerReady){
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'],{type:'text/javascript'}));
    workerReady=true;
  }
  var pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true}).promise;
  var txt='';
  for(var p=1;p<=pdf.numPages;p++){
    var pg=await pdf.getPage(p),c=await pg.getTextContent(),line='';
    c.items.forEach(function(it){line+=it.str+(it.hasEOL?'\n':' ')});
    txt+=line+'\n\n';
  }
  return txt.replace(/([\u3400-\u9fff])[ \t]+(?=[\u3400-\u9fff])/g,'$1').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function handleFile(f){
  if(!f)return;
  var chip=$('fname');
  chip.style.display='inline-block';chip.textContent='⏳ '+t('reading');
  try{
    var isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
    var txt=isPdf?await readPDF(f):await f.text();
    if(!txt.trim()){
      chip.style.display='none';res.style.display='block';last=null;renderStats();showErr('pdfEmpty');
    }else{
      story.value=txt;updateCount();chip.textContent='📎 '+f.name;res.style.display='none';
    }
  }catch(e){
    chip.style.display='none';res.style.display='block';last=null;renderStats();
    showErr(e&&e.key?e.key:'pdfFail');
  }
  $('file').value='';
}
$('pick').onclick=function(){$('file').click()};
$('file').onchange=function(){handleFile(this.files[0])};
['dragenter','dragover'].forEach(function(ev){story.addEventListener(ev,function(e){e.preventDefault();story.classList.add('drag')})});
['dragleave','drop'].forEach(function(ev){story.addEventListener(ev,function(){story.classList.remove('drag')})});
story.addEventListener('drop',function(e){e.preventDefault();handleFile(e.dataTransfer.files[0])});

/* start: remembered language, else browser language, else English */
(function(){
  var c='en';
  try{c=localStorage.getItem('storysum-lang')||''}catch(e){}
  if(!T[c]){var n=(navigator.language||'en').slice(0,2);c=T[n]?n:'en'}
  $('lang').value=c;applyLang(c);
})();
</script>
